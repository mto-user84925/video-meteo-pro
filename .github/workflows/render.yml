name: Render Video Meteo Pro

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session ID du rendu'
        required: true
        type: string
  # Appel direct possible depuis un autre workflow (secours si GITHUB_PAT absent)
  workflow_call:
    inputs:
      session_id:
        required: true
        type: string

# Un seul rendu par session à la fois ; les lancements simultanés sont sérialisés
# au lieu de saturer la file des runners (import de N cartes = 1 seul rendu).
concurrency:
  group: render-${{ github.event.inputs.session_id || inputs.session_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_ID: ${{ github.event.inputs.session_id || inputs.session_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ubdevaemtwbzxksjlhjg.supabase.co' }}
      # Écriture Storage : service_role obligatoire depuis le durcissement RLS.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (FFmpeg & Fonts)
        # Les miroirs apt d'Ubuntu peuvent être lents au démarrage : 4 min était
        # trop court (2 échecs le 22/10 à 14:07 et 16:54). Timeout élargi,
        # retries augmentés et nouvelle tentative complète en cas d'échec.
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get update $APT_OPTS || { sleep 5; sudo apt-get update $APT_OPTS; }
          sudo apt-get install -y --no-install-recommends $APT_OPTS \
            ffmpeg fonts-dejavu-core fonts-liberation \
            || { echo "Échec installation, nouvelle tentative..."; sleep 10; \
                 sudo dpkg --configure -a || true; \
                 sudo apt-get install -y --no-install-recommends $APT_OPTS ffmpeg fonts-dejavu-core fonts-liberation; }
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        timeout-minutes: 3
        run: |
          python -m pip install --upgrade pip
          pip install Pillow curl_cffi

      - name: Download job.json from Supabase
        run: |
          set -e
          if [ -z "$SESSION_ID" ]; then echo "::error::session_id manquant"; exit 1; fi
          curl -f -sSL --retry 3 --retry-delay 2 \
            "$SUPABASE_URL/storage/v1/object/public/blog-images/renders/${SESSION_ID}/job.json" -o job.json
          # Garde-fou : un corps HTML/erreur ne doit pas être exécuté comme job
          python -c "import json;json.load(open('job.json',encoding='utf-8'))" \
            || { echo "::error::job.json invalide ou introuvable"; exit 1; }

      - name: Run Video Render Engine
        timeout-minutes: 10
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/render_engine.py --job job.json

      # Toujours publier un état terminal lisible par /api/status, même si le
      # runner est annulé ou les étapes de préparation échouent.
      - name: Publish failure status
        if: failure() || cancelled()
        run: python scripts/publish_failure_status.py --session-id "$SESSION_ID"
